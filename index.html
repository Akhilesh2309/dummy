<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="body">
    <div class="container">
        <h1 class="heading">Contact Us</h1>
        <form class="form">
            <label for="name" class="label">Name:</label>
            <input type="text" id="name" class="input" placeholder="Enter your name" required>

            <label for="email" class="label">Email:</label>
            <input type="email" id="email" class="input" placeholder="Enter your email" required>

            <label for="message" class="label">Message:</label>
            <textarea id="message" class="textarea" placeholder="Your message..." required></textarea>

            <button type="submit" class="btn">Submit</button>
        </form>
    </div>
</body>
</html>
